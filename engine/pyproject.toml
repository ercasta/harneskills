[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugm"
version = "0.1.0"
description = "An entity-component world, a loop of rules over it, and one thread to run a session on"
readme = { text = "UGM", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ecs", "entity-component", "game-loop", "world-model"]

# No dependencies, and that is the whole of it. This is the substrate
# `harneskills` is built on -- a world, a loop, an engine to run one on --
# and it ships no domain, no channel and no transport, so nothing above
# it is baked in here. It used to also ship a `fact`/`state`/`deny`
# vocabulary and a generic arbitration reader (`facts.py`/
# `arbitration.py`/`request.py`) -- removed, not ported, once `world.py`
# was rewritten to plain dataclass components; DECISION_PATTERNS.md keeps
# the argument for arbitration even without the code. See the Scope
# section of README.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "__pycache__", ".git", "*.egg-info"]

[tool.setuptools]
py-modules = []
packages = ["ugm"]
