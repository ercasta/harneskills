[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harneskills"
version = "0.1.0"
description = "HarneSkills — a plain terminal onto a UGM machine, carved out of ugm.repl"
readme = { text = "HarneSkills", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["repl", "agent", "knowledge-graph", "reasoning", "ugm"]

# One dependency, and that is the whole of it: the engine. This repo is a
# REPL over UGM, not a second implementation of one.
#
# ⚠ `universal-graph-machine` is pinned by VERSION and tracks a package that
# is under active redesign. An unpinned floor is not a safety net here. If
# imports start failing, read ../ugm/docs/HANDOFF.md before anything else --
# it records shape changes.
dependencies = [
    "universal-graph-machine>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harneskills = "harneskills.__main__:main"
harneskills-fs = "harneskills.examples.fs:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "__pycache__", ".git", "*.egg-info"]

[tool.setuptools]
py-modules = []
packages = ["harneskills", "harneskills.examples"]
