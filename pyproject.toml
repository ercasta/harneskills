[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harneskills"
version = "0.4.0"
description = "A world model, a game loop of Python rules over it, and a prompt onto both"
readme = { text = "HarneSkills", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["repl", "agent", "rules", "game-loop", "world-model"]

# One dependency: `loopingrules` -- the world/loop/engine this package
# used to carry itself, then embedded here under `./engine` (importable
# as `ugm`), now its own repo (`../loopingrules`, a sibling checkout, not
# a subdirectory of this one) so a domain can depend on the engine
# without depending on a terminal, a WebSocket door, or config file
# conventions it has no use for. Everything under `harneskills/` is a
# door onto that engine, or config for opening one; see
# `../loopingrules`'s own README for what it is on its own.
#
# Not yet published anywhere -- `pip install -e ../loopingrules -e .`
# from the repo root, with `../loopingrules` checked out beside this
# repo, for a real install. `pythonpath` below is what lets `pytest`
# find it from this checkout without either, on that same assumption.
dependencies = ["loopingrules"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harneskills = "harneskills.__main__:main"
harneskills-client = "harneskills.client:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "__pycache__", ".git", "*.egg-info"]
pythonpath = ["../loopingrules"]

[tool.setuptools]
py-modules = []
packages = ["harneskills", "harneskills.examples"]
