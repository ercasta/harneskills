[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harneskills"
version = "0.0.0"
description = "Harneskills — iterative LLM harness with TUI, fine-tuned SLM, and CNL knowledge authoring"
readme = { text = "Harneskills", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "tui", "textual", "agent", "knowledge-graph"]
dependencies = [
    # ⚠ Pinned by VERSION, not by branch — upstream's CHANGELOG exists because a consumer's pin went
    # red, and it records every shape change. 0.3.0 is the `ugm` package (was `microfunctions`).
    "universal-graph-machine>=0.3.0",
    "textual==8.2.5",
    "PyYAML==6.0.3",
    "sentence-transformers==5.4.1",
    "chromadb==1.5.9",
    "watchdog==6.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "tiktoken>=0.7",
]

# ⚠ The `[asp]` extra is gone: upstream has NO optional dependencies (and no dependencies at all).
[project.scripts]
harneskills = "harneskills_tui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
norecursedirs = ["buggy_samples", ".venv", "__pycache__", ".git", "*.egg-info"]
markers = ["slow: marks tests as slow"]

[tool.setuptools]
py-modules = []
packages = ["harneskills", "harneskills_tui"]
