[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harneskills"
version = "0.3.0"
description = "A world model, a game loop of Python rules over it, and a prompt onto both"
readme = { text = "HarneSkills", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["repl", "agent", "rules", "game-loop", "world-model"]

# No dependencies, and that is the whole of it. The engine used to be one
# -- `universal-graph-machine`, a graph substrate this repo was a terminal
# onto -- and the loop in `harneskills/loop.py` is what replaced it: call
# every rule, in order, until nothing changes. A rule is a Python function
# of one `World`, so a domain brings itself and needs nothing installed
# underneath it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harneskills = "harneskills.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "__pycache__", ".git", "*.egg-info"]

[tool.setuptools]
py-modules = []
packages = ["harneskills", "harneskills.examples"]
